name: Website Frontend Tooling Bootstrap

on:
  push:
    branches:
      - chore/website-frontend-tooling-alignment
    paths:
      - 'website-ui/**'
      - '.github/workflows/website-frontend-tooling-bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chore/website-frontend-tooling-alignment

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'

      - name: Install dependencies
        working-directory: website-ui
        run: npm install --ignore-scripts

      - name: Format frontend
        working-directory: website-ui
        run: npm run format

      - name: Commit generated lockfile and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website-ui/package-lock.json website-ui/apps website-ui/packages website-ui/scripts
          if git diff --cached --quiet; then
            echo "No bootstrap changes."
            exit 0
          fi
          git commit -m "chore: bootstrap frontend tooling artifacts"
          git push origin HEAD:chore/website-frontend-tooling-alignment
