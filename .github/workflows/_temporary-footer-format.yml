name: Temporary marketing footer formatter
on:
  push:
    branches: [main]
    paths: [.github/workflows/_temporary-footer-format.yml]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - name: Install dependencies
        working-directory: website-ui
        run: npm ci --ignore-scripts
      - name: Format footer and print
        working-directory: website-ui
        run: |
          npx oxfmt apps/web/app/layout/MarketingLayout/MarketingFooter.tsx
          echo "FOOTER_FORMAT_START"
          base64 -w0 apps/web/app/layout/MarketingLayout/MarketingFooter.tsx
          echo
          echo "FOOTER_FORMAT_END"
