name: Website Frontend CI

on:
  pull_request:
    paths:
      - 'website-ui/**'
      - '.github/workflows/website-frontend-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'website-ui/**'
      - '.github/workflows/website-frontend-ci.yml'

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch user-provided documentation icon
        shell: bash
        run: |
          curl -fLsS --max-time 30 --retry 2 -A "Mozilla/5.0" "https://mintcdn.com/collatedocs/yvgGxaeRR5RwtQo6/public/images/icons/ask-ai-home.svg" -o /tmp/ask-ai-home.svg
          echo "BEGIN_ICON_BASE64"
          base64 -w0 /tmp/ask-ai-home.svg
          echo
          echo "END_ICON_BASE64"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
          cache-dependency-path: website-ui/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Frontend format
        run: npm run format:check

      - name: Frontend lint
        run: npm run lint

      - name: Frontend type check
        run: npm run typecheck

      - name: Frontend architecture
        run: npm run architecture:check

      - name: Frontend build
        run: npm run build
