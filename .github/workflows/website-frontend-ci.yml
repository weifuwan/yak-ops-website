name: Website Frontend CI

on:
  pull_request:
    paths:
      - 'website-ui/**'
      - '.github/workflows/website-frontend-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'website-ui/**'
      - '.github/workflows/website-frontend-ci.yml'

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website-ui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Frontend format
        run: npm run format:check

      - name: Frontend lint
        run: npm run lint

      - name: Frontend type check
        run: npm run typecheck

      - name: Frontend architecture
        run: npm run architecture:check

      - name: Frontend build
        run: npm run build
