name: Temporary TSX formatting output

on:
  push:
    branches:
      - feat/context-platform-inline-svg-20261028

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - name: Install frontend dependencies
        working-directory: website-ui
        run: npm ci --ignore-scripts
      - name: Format TSX and print transferable output
        working-directory: website-ui
        run: |
          npx oxfmt apps/web/app/home/components/CollateArchitecture.tsx apps/web/app/home/components/ContextPlatformSection.tsx
          for file in apps/web/app/home/components/CollateArchitecture.tsx apps/web/app/home/components/ContextPlatformSection.tsx; do
            echo "FORMATTED_START:$file"
            base64 -w0 "$file"
            echo
            echo "FORMATTED_END:$file"
          done
