name: Temporary Panorama Validation
on:
  push:
    paths:
      - .github/workflows/panorama-targeted-validation.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm
          cache-dependency-path: website-ui/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: website-ui
      - name: Check changed component format
        run: ./node_modules/.bin/oxfmt --check apps/web/app/home/components/YakOpsProductPanorama.tsx apps/web/app/home/components/ContextPlatformSection.tsx
        working-directory: website-ui
      - name: Frontend lint
        run: npm run lint
        working-directory: website-ui
      - name: Frontend type check
        run: npm run typecheck
        working-directory: website-ui
      - name: Frontend architecture
        run: npm run architecture:check
        working-directory: website-ui
      - name: Frontend build
        run: npm run build
        working-directory: website-ui
