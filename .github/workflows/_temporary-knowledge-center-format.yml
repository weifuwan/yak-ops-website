name: Temporary knowledge center formatter
on:
  push:
    branches: [main]
    paths: [.github/workflows/_temporary-knowledge-center-format.yml]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - name: Install dependencies
        working-directory: website-ui
        run: npm ci --ignore-scripts
      - name: Format and print TSX
        working-directory: website-ui
        run: |
          npx oxfmt apps/web/app/home/components/HomeKnowledgeCenterSection.tsx
          echo "KNOWLEDGE_FORMAT_START"
          base64 -w0 apps/web/app/home/components/HomeKnowledgeCenterSection.tsx
          echo
          echo "KNOWLEDGE_FORMAT_END"
