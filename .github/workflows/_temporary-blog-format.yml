name: Temporary blog formatter
on:
  push:
    branches: [main]
    paths: [.github/workflows/_temporary-blog-format.yml]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - name: Install frontend dependencies
        working-directory: website-ui
        run: npm ci --ignore-scripts
      - name: Format blog TSX
        working-directory: website-ui
        run: |
          npx oxfmt apps/web/app/blog/index.tsx
          echo "BLOG_FORMAT_START"
          base64 -w0 apps/web/app/blog/index.tsx
          echo
          echo "BLOG_FORMAT_END"
