name: Temporary header menu formatter
on:
  push:
    branches: [main]
    paths: [.github/workflows/_temporary-header-menu-format.yml]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - name: Install frontend dependencies
        working-directory: website-ui
        run: npm ci --ignore-scripts
      - name: Format and print header
        working-directory: website-ui
        run: |
          npx oxfmt apps/web/app/layout/MarketingLayout/MarketingHeader.tsx
          echo "HEADER_MENU_FORMAT_START"
          base64 -w0 apps/web/app/layout/MarketingLayout/MarketingHeader.tsx
          echo
          echo "HEADER_MENU_FORMAT_END"
