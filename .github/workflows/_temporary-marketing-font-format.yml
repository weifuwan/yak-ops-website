name: Temporary marketing typography format
on:
  push:
    branches: [main]
    paths: [.github/workflows/_temporary-marketing-font-format.yml]
permissions:
  contents: read
jobs:
  format-svg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - name: Install frontend dependencies
        working-directory: website-ui
        run: npm ci --ignore-scripts
      - name: Format SVG typography and emit result
        working-directory: website-ui
        run: |
          npx oxfmt apps/web/app/home/components/CollateArchitecture.tsx
          echo "SVG_FONT_FORMAT_START"
          base64 -w0 apps/web/app/home/components/CollateArchitecture.tsx
          echo
          echo "SVG_FONT_FORMAT_END"
