name: Temporary industry formatter
on:
  push:
    branches: [main]
    paths: [.github/workflows/_temporary-industry-format.yml]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - name: Install dependencies
        working-directory: website-ui
        run: npm ci --ignore-scripts
      - name: Format industry tabs and print
        working-directory: website-ui
        run: |
          npx oxfmt apps/web/app/home/components/HomeIndustriesSection.tsx apps/web/app/home/index.tsx
          for file in apps/web/app/home/components/HomeIndustriesSection.tsx apps/web/app/home/index.tsx; do
            echo "INDUSTRY_FORMAT_START:$file"
            base64 -w0 "$file"
            echo
            echo "INDUSTRY_FORMAT_END:$file"
          done
