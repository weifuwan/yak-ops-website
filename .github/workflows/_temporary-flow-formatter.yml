name: Temporary SVG flow formatter

on:
  push:
    branches:
      - feat/website-collate-animated-flow-connectors-20261028

permissions:
  contents: read

jobs:
  format-svg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - name: Install frontend dependencies
        working-directory: website-ui
        run: npm ci --ignore-scripts
      - name: Format SVG component and emit text for commit
        working-directory: website-ui
        run: |
          npx oxfmt apps/web/app/home/components/CollateArchitecture.tsx
          echo "FORMATTED_SVG_START"
          base64 -w0 apps/web/app/home/components/CollateArchitecture.tsx
          echo
          echo "FORMATTED_SVG_END"
