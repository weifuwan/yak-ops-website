server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: yak-ops-website
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/yak_ops_website?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:smtp.qiye.aliyun.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:noreply@yak-ops.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          ssl:
            enable: ${MAIL_SSL:true}
          starttls:
            enable: ${MAIL_STARTTLS:false}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

website:
  account:
    public-base-url: ${WEBSITE_PUBLIC_BASE_URL:http://localhost:8000}
    registration-code-ttl: 10m
    registration-setup-ttl: 15m
    reset-password-ttl: 30m
    session-ttl: ${WEBSITE_SESSION_TTL:30m}
    session-cookie-name: ${WEBSITE_SESSION_COOKIE_NAME:yakops_web_session}
    session-cookie-secure: ${WEBSITE_SESSION_COOKIE_SECURE:false}
    mail-from: ${WEBSITE_MAIL_FROM:noreply@yak-ops.com}
  traffic:
    visitor-cookie-name: yakops_visitor
    visitor-cookie-max-age: 365d
    visitor-cookie-secure: ${WEBSITE_SESSION_COOKIE_SECURE:false}
  mail:
    mode: ${WEBSITE_MAIL_MODE:smtp}
