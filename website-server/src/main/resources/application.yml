server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: yak-ops-website
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/yak_ops_website?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          ssl:
            enable: ${MAIL_SSL:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}

sa-token:
  token-name: yakops_web_session
  cookie:
    path: /
    http-only: true
    same-site: Lax
    secure: ${SA_TOKEN_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

yak:
  security:
    enabled: true
    database-enabled: true
    web-enabled: true
    authentication-enabled: true
    application-name: yak-ops-website
    audit-enabled: false
    datasource:
      enabled: true
      url: ${SECURITY_DB_URL:jdbc:mysql://127.0.0.1:3306/yak_ops_website?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
      username: ${SECURITY_DB_USERNAME:root}
      password: ${SECURITY_DB_PASSWORD:123456}
      driver-class-name: com.mysql.cj.jdbc.Driver
    authentication:
      storage: MEMORY
      idle-timeout: 30m
    bootstrap:
      enabled: false
    permission-registration:
      enabled: false
    public-paths:
      - /api/v1/auth/register/request-code
      - /api/v1/auth/register/verify-code
      - /api/v1/auth/register/complete
      - /api/v1/auth/login
      - /api/v1/auth/forgot-password
      - /api/v1/auth/reset-password
      - /actuator/health/**
      - /error

website:
  account:
    public-base-url: ${WEBSITE_PUBLIC_BASE_URL:http://localhost:8000}
    registration-code-ttl: 10m
    registration-setup-ttl: 15m
    reset-password-ttl: 30m
    mail-from: ${WEBSITE_MAIL_FROM:no-reply@yakops.local}
  mail:
    mode: ${WEBSITE_MAIL_MODE:log}
