services:
  mysql:
    image: mysql:8.4
    container_name: yak-ops-website-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: yak_ops_website
      MYSQL_ROOT_PASSWORD: yakops
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -pyakops --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  security-mysql:
    image: mysql:8.4
    container_name: yak-ops-website-security-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: yak_ops_website_security
      MYSQL_ROOT_PASSWORD: yakops
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - ./data/security-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -pyakops --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
